<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekayasa Perangkat Lunak</title>
    
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animasi Latar Belakang (Blobs) */
        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            z-index: 1;
            animation: float 7s ease-in-out infinite;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            background: #a855f7;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            background: #2563eb;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        /* Kartu Login Utama */
        .login-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            margin: 1rem;
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Header & Penyesuaian Logo Baru */
        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #a855f7, #2563eb);
            border-radius: 16px;
            margin-bottom: 1.25rem;
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.25);
            transition: transform 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-icon:hover {
            transform: rotate(12deg);
        }

        .header-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-container h2 {
            color: #ffffff;
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .header-container p {
            color: #94a3b8;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        /* Tombol Utama */
        .btn-submit {
            width: 100%;
            padding: 0;
            background: linear-gradient(90deg, #a855f7, #2563eb);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .btn-submit a {
            display: block;
            width: 100%;
            padding: 0.85rem;
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

       
       
    </style>       
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-card">
        
        <div class="header-container">
            <div class="brand-icon">
                <img src="logo.jpeg" alt="">
            </div>
            <h2>Rekayasa Perangkat lunak</h2>
            <p>Kaprog Pak Arif Hidayat</p>
        </div>

        <form id="loginForm" onsubmit="handleSubmit(event)">
            <button type="submit" class="btn-submit">
                <a href="dasbord.html">Masuk</a>
            </button>
        </form>

    </div>

   

</body>
</html>
